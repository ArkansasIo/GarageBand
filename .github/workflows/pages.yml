name: Deploy StudioWave to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static browser app
        run: |
          mkdir -p _site/src _site/docs _site/assets/sounds
          cp index.html _site/index.html
          cp src/app.js src/styles.css _site/src/
          cp -R assets/sounds/. _site/assets/sounds/
          cp docs/ROADMAP.md docs/ARCHITECTURE.md docs/API_AND_DATABASE.md _site/docs/
          touch _site/.nojekyll
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
